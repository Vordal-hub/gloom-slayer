name: Deploy Gloom Slayer

on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build — copy game + assets to dist/
        run: |
          mkdir -p dist
          cp gloom-slayer-1.0.0.html dist/index.html
          # Copy PWA assets if present
          [ -f manifest.json ] && cp manifest.json dist/
          [ -f sw.js ]         && cp sw.js         dist/
          # Copy audio files
          for f in *.mp3; do [ -f "$f" ] && cp "$f" dist/; done
          echo "Build complete. Files in dist/:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
